name: Build

on:
  push:
    branches: ["master", "implementation/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Run tests and build size-limited Java 21 development plugin
        run: bash ./gradlew --no-daemon clean test build
      - name: Upload development build (native payloads may be absent)
        uses: actions/upload-artifact@v4
        with:
          name: musicolide-development-build
          path: build/libs/musicolide-*.jar
          if-no-files-found: error

  native-runtime-smoke:
    name: Real Linux x86_64 native-tool smoke test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned tools, verify hashes and test OGG encoding
        run: bash scripts/smoke-native-tools-linux-x86_64.sh
