name: Build

on:
  push:
    branches: ["master", "implementation/**", "feature/discord-broadcast", "feature/discord-command-suite"]
  pull_request:
  workflow_dispatch:

jobs:
  cleanup-old-artifacts:
    name: Clean up old development JAR artifacts
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep the two newest development JARs
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const keepCount = 1;

            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            );

            const developmentBuilds = artifacts
              .filter(artifact =>
                artifact.name === "musicolide-development-build" && !artifact.expired
              )
              .sort((a, b) =>
                new Date(b.created_at).getTime() - new Date(a.created_at).getTime()
              );

            const staleArtifacts = developmentBuilds.slice(keepCount);

            for (const artifact of staleArtifacts) {
              await github.rest.actions.deleteArtifact({
                owner,
                repo,
                artifact_id: artifact.id
              });
              core.info(`Deleted old development artifact ${artifact.id} from run ${artifact.workflow_run.id}.`);
            }

            core.info(`Found ${developmentBuilds.length} non-expired development artifacts; kept the newest ${Math.min(keepCount, developmentBuilds.length)} and deleted ${staleArtifacts.length} older artifact(s).`);


  build:
    needs: cleanup-old-artifacts
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Run tests and build size-limited Java 21 development plugin
        run: bash ./gradlew --no-daemon clean test build
      - name: Upload development build (best effort; tests do not depend on artifact storage)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: musicolide-development-build
          path: build/libs/musicolide-*.jar
          if-no-files-found: error
          retention-days: 3

  native-runtime-smoke:
    name: Real Linux x86_64 native-tool smoke test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned tools, verify hashes and test OGG encoding
        run: bash scripts/smoke-native-tools-linux-x86_64.sh
