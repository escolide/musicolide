name: Build

on:
  push:
    branches: ["master", "implementation/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Fetch pinned Linux x86_64 audio tools
        run: bash ./scripts/fetch-native-tools.sh
      - name: Verify bundled native tools
        run: |
          chmod +x src/main/native/linux-x86_64/*
          src/main/native/linux-x86_64/ffmpeg -version
          src/main/native/linux-x86_64/ffprobe -version
          src/main/native/linux-x86_64/yt-dlp --version
      - name: Run tests and build Java 21-compatible plugin
        run: bash ./gradlew --no-daemon clean test shadowJar
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: musicolide-plugin
          path: build/libs/musicolide-*.jar
