import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar
import java.security.MessageDigest
import java.sql.Driver
import java.util.Properties
import java.util.zip.ZipFile
import java.util.zip.ZipInputStream

plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.2.2'
}

group = 'io.github.escolide'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    // Keep the optional Discord implementation isolated from the server plugin
    // classloader. The pinned Java runtime artifacts are downloaded on first use.
    discordRuntime
    // Resolve platform-specific DAVE archives at build time so their checksums
    // can be pinned into the JAR; servers download only their matching native.
    discordNativeBundle
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://repo.opencollab.dev/main/' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.1-R0.1-SNAPSHOT'
    compileOnly 'org.geysermc.geyser:api:2.11.2-SNAPSHOT'
    // Netty is supplied by Paper/Purpur at runtime; keep it out of the plugin JAR.
    compileOnly 'io.netty:netty-codec-http:4.1.115.Final'
    implementation 'org.xerial:sqlite-jdbc:3.50.3.0'
    implementation 'org.apache.commons:commons-compress:1.28.0'
    implementation 'org.tukaani:xz:1.10'
    implementation 'com.google.code.gson:gson:2.15.0'
    // Compile the optional Discord broadcaster without placing its runtime on
    // Musicolide's primary classpath. DiscordRuntimeBundle loads it separately.
    compileOnly 'net.dv8tion:JDA:6.7.0'
    compileOnly 'moe.kyokobot.libdave:adapter-jda:0.1.2'
    compileOnly 'moe.kyokobot.libdave:impl-jni:0.1.2'
    discordRuntime 'net.dv8tion:JDA:6.7.0'
    discordRuntime 'moe.kyokobot.libdave:adapter-jda:0.1.2'
    discordRuntime 'moe.kyokobot.libdave:impl-jni:0.1.2'

    // Common Paper/Purpur server platforms. The plugin ships the Java wrapper
    // and pinned hashes, then downloads only the selected native JAR on enable.
    discordNativeBundle 'moe.kyokobot.libdave:natives-linux-x86-64:0.1.2'
    discordNativeBundle 'moe.kyokobot.libdave:natives-linux-aarch64:0.1.2'
    discordNativeBundle 'moe.kyokobot.libdave:natives-win-x86-64:0.1.2'
    discordNativeBundle 'moe.kyokobot.libdave:natives-darwin:0.1.2'

    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'net.dv8tion:JDA:6.7.0'
    testCompileOnly 'moe.kyokobot.libdave:impl-jni:0.1.2'
    testRuntimeOnly 'moe.kyokobot.libdave:adapter-jda:0.1.2'
    testRuntimeOnly 'moe.kyokobot.libdave:impl-jni:0.1.2'
    testRuntimeOnly 'moe.kyokobot.libdave:natives-linux-x86-64:0.1.2'
    testImplementation 'io.netty:netty-codec-http:4.1.115.Final'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('test') {
    useJUnitPlatform()
}

def discordRuntimeManifestFile = layout.buildDirectory.file('generated/discord-runtime/RUNTIME_ARTIFACTS')
def discordNativeManifestFile = layout.buildDirectory.file('generated/discord-runtime/NATIVE_ARTIFACTS')

tasks.register('generateDiscordRuntimeManifest') {
    inputs.files(configurations.discordRuntime, configurations.discordNativeBundle)
    outputs.files(discordRuntimeManifestFile, discordNativeManifestFile)
    doLast {
        def runtimeArtifacts = configurations.discordRuntime.resolvedConfiguration.resolvedArtifacts
                .findAll { it.type == 'jar' }.sort { it.file.name }
        def nativeArtifacts = configurations.discordNativeBundle.files.sort { it.name }
        if (runtimeArtifacts.size() < 4 || nativeArtifacts.size() != 4
                || runtimeArtifacts.any { !it.file.isFile() || !it.file.name.endsWith('.jar') }
                || nativeArtifacts.any { !it.isFile() || !it.name.endsWith('.jar') }) {
            throw new GradleException('Discord runtime resolution is incomplete or contains a non-JAR artifact.')
        }

        def allNames = runtimeArtifacts.collect { it.file.name } + nativeArtifacts.collect { it.name }
        def duplicateNames = allNames.groupBy { it }.findAll { name, values -> values.size() > 1 }.keySet()
        if (!duplicateNames.isEmpty()) {
            throw new GradleException('Discord runtime has colliding artifact names: ' + duplicateNames.sort().join(', '))
        }

        def sha256 = { file ->
            MessageDigest digest = MessageDigest.getInstance('SHA-256')
            file.withInputStream { input ->
                byte[] buffer = new byte[64 * 1024]
                int read
                while ((read = input.read(buffer)) != -1) digest.update(buffer, 0, read)
            }
            digest.digest().encodeHex().toString()
        }

        def runtimeLines = runtimeArtifacts.collect { artifact ->
            def module = artifact.moduleVersion.id
            def groupPath = module.group.replace('.', '/')
            def file = artifact.file
            def url = 'https://repo.maven.apache.org/maven2/' + groupPath + '/' + module.name + '/' + module.version + '/' + file.name
            file.name + '|' + sha256(file) + '|' + url
        }
        def requiredDiscordFiles = [
                'JDA-6.7.0.jar',
                'adapter-jda-0.1.2.jar',
                'impl-jni-0.1.2.jar'
        ] as Set
        def runtimeNames = runtimeArtifacts.collect { it.file.name } as Set
        if (!runtimeNames.containsAll(requiredDiscordFiles)) {
            throw new GradleException('Discord runtime manifest is missing one or more required JDA/DAVE Java artifacts.')
        }
        def runtimeManifest = discordRuntimeManifestFile.get().asFile
        runtimeManifest.parentFile.mkdirs()
        runtimeManifest.setText(runtimeLines.join('\n') + '\n', 'UTF-8')

        def platformByNativeFile = [
                'natives-linux-x86-64-0.1.2.jar': 'linux-x86-64',
                'natives-linux-aarch64-0.1.2.jar': 'linux-aarch64',
                'natives-win-x86-64-0.1.2.jar': 'windows-x86-64',
                'natives-darwin-0.1.2.jar': 'macos-universal'
        ]
        def nativeLines = nativeArtifacts.collect { file ->
            def platform = platformByNativeFile[file.name]
            if (platform == null) {
                throw new GradleException('Unexpected DAVE native artifact: ' + file.name)
            }
            def artifactId = file.name.substring(0, file.name.lastIndexOf('-0.1.2.jar'))
            def url = 'https://repo.maven.apache.org/maven2/moe/kyokobot/libdave/' + artifactId + '/0.1.2/' + file.name
            platform + '|' + file.name + '|' + sha256(file) + '|' + url
        }
        def nativeManifest = discordNativeManifestFile.get().asFile
        nativeManifest.parentFile.mkdirs()
        nativeManifest.setText(nativeLines.join('\n') + '\n', 'UTF-8')
    }
}

def discordBundleTask = tasks.register('discordRuntimeBundle', Zip) {
    dependsOn tasks.named('generateDiscordRuntimeManifest')
    from(discordRuntimeManifestFile) {
        rename { 'RUNTIME_ARTIFACTS' }
    }
    from(discordNativeManifestFile) {
        rename { 'NATIVE_ARTIFACTS' }
    }
    archiveFileName = 'discord-runtime.zip'
    destinationDirectory = layout.buildDirectory.dir('generated/discord-runtime')
    entryCompression = org.gradle.api.tasks.bundling.ZipEntryCompression.DEFLATED
    duplicatesStrategy = org.gradle.api.file.DuplicatesStrategy.FAIL
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

// One cross-platform artifact. Discord remains opt-in and is loaded through an
// isolated child classloader only when discord.enabled is true.
tasks.named('shadowJar', ShadowJar) {
    archiveClassifier = 'universal'
    dependsOn discordBundleTask
    from(discordBundleTask.flatMap { it.archiveFile }) {
        into 'META-INF/musicolide'
        rename { 'discord-runtime.zip' }
    }
    mergeServiceFiles()
}

tasks.named('jar') {
    enabled = false
}

tasks.register('verifyPluginJarSize') {
    dependsOn tasks.named('verifyUniversalPluginJarSize')
}

tasks.register('verifyUniversalPluginJarSize') {
    dependsOn tasks.named('shadowJar')
    doLast {
        def pluginJar = tasks.named('shadowJar', ShadowJar).get().archiveFile.get().asFile
        def maximumBytes = 30L * 1024L * 1024L
        if (pluginJar.length() >= maximumBytes) {
            throw new GradleException('Universal plugin JAR is ' + pluginJar.length()
                    + ' bytes; it must remain below 30 MiB.')
        }

        ZipFile zip = new ZipFile(pluginJar)
        try {
            def names = zip.entries().toList().findAll { !it.isDirectory() }.collect { it.name } as Set
            def requiredEntries = [
                    'io/github/escolide/musicolide/audio/NativeToolDownloader.class',
                    'org/apache/commons/compress/archivers/tar/TarArchiveInputStream.class',
                    'org/tukaani/xz/XZInputStream.class',
                    'META-INF/musicolide/discord-runtime.zip'
            ] as Set
            def missingEntries = requiredEntries - names
            if (!missingEntries.isEmpty()) {
                throw new GradleException('Universal JAR is missing required installer/runtime entries: '
                        + missingEntries.sort().join(', '))
            }
            if (names.any { it.startsWith('native-bundles/') }) {
                throw new GradleException('The universal JAR must download FFmpeg/yt-dlp tools on first start; do not embed those large binaries.')
            }

            def runtimeEntry = zip.getEntry('META-INF/musicolide/discord-runtime.zip')
            if (runtimeEntry.size < 1 || runtimeEntry.size > 1024L * 1024L) {
                throw new GradleException('Embedded Discord runtime manifest is empty or exceeds 1 MiB.')
            }
            String runtimeManifestText = null
            String nativeManifestText = null
            ZipInputStream runtimeZip = new ZipInputStream(zip.getInputStream(runtimeEntry))
            try {
                def entry
                byte[] buffer = new byte[8 * 1024]
                while ((entry = runtimeZip.getNextEntry()) != null) {
                    if (entry.isDirectory()) {
                        throw new GradleException('Directory entries are not permitted in the Discord manifest bundle.')
                    }
                    def output = new ByteArrayOutputStream()
                    int count
                    while ((count = runtimeZip.read(buffer)) != -1) {
                        if (output.size() + count > 1024 * 1024) {
                            throw new GradleException('Discord runtime manifest entry is too large.')
                        }
                        output.write(buffer, 0, count)
                    }
                    if (entry.name == 'RUNTIME_ARTIFACTS') {
                        if (runtimeManifestText != null) throw new GradleException('Duplicate runtime artifact manifest.')
                        runtimeManifestText = output.toString('UTF-8')
                    } else if (entry.name == 'NATIVE_ARTIFACTS') {
                        if (nativeManifestText != null) throw new GradleException('Duplicate native artifact manifest.')
                        nativeManifestText = output.toString('UTF-8')
                    } else {
                        throw new GradleException('Unexpected Discord manifest entry: ' + entry.name)
                    }
                }
            } finally {
                runtimeZip.close()
            }
            if (runtimeManifestText == null || nativeManifestText == null) {
                throw new GradleException('Embedded Discord runtime manifests are incomplete.')
            }

            Set<String> runtimeNames = new TreeSet<>()
            runtimeManifestText.readLines().findAll { !it.isBlank() }.each { line ->
                def fields = line.split('\\|', -1)
                if (fields.length != 3 || !(fields[0] ==~ /[A-Za-z0-9._+-]+\\.jar/)
                        || !(fields[1] ==~ /[0-9a-f]{64}/)
                        || !fields[2].startsWith('https://repo.maven.apache.org/maven2/')) {
                    throw new GradleException('Invalid Discord Java runtime manifest entry.')
                }
                if (!runtimeNames.add(fields[0])) {
                    throw new GradleException('Duplicate Discord Java runtime artifact: ' + fields[0])
                }
            }
            def requiredDiscordArtifacts = [
                    'JDA-6.7.0.jar',
                    'adapter-jda-0.1.2.jar',
                    'impl-jni-0.1.2.jar'
            ] as Set
            if (!runtimeNames.containsAll(requiredDiscordArtifacts)) {
                throw new GradleException('Embedded Discord manifest is missing required JDA/DAVE Java artifacts.')
            }

            def expectedNativeEntries = [
                    'linux-x86-64|natives-linux-x86-64-0.1.2.jar',
                    'linux-aarch64|natives-linux-aarch64-0.1.2.jar',
                    'windows-x86-64|natives-win-x86-64-0.1.2.jar',
                    'macos-universal|natives-darwin-0.1.2.jar'
            ] as Set
            def actualNativeEntries = nativeManifestText.readLines().findAll { !it.isBlank() }
                    .collect { line ->
                        def fields = line.split('\\|', -1)
                        if (fields.length != 4 || !(fields[2] ==~ /[0-9a-f]{64}/)
                                || !fields[3].startsWith('https://repo.maven.apache.org/maven2/moe/kyokobot/libdave/')) {
                            throw new GradleException('Invalid DAVE native artifact manifest entry.')
                        }
                        fields[0] + '|' + fields[1]
                    } as Set
            if (actualNativeEntries != expectedNativeEntries) {
                throw new GradleException('Universal JAR is missing one or more supported Discord native targets.')
            }

            // Verify the universal SQLite driver and its native payloads independently
            // of the optional Discord classloader.
            URLClassLoader loader = new URLClassLoader(
                    [pluginJar.toURI().toURL()] as URL[], ClassLoader.getPlatformClassLoader())
            try {
                Class driverType = Class.forName('org.sqlite.JDBC', true, loader)
                Driver driver = (Driver) driverType.getDeclaredConstructor().newInstance()
                def connection = driver.connect('jdbc:sqlite::memory:', new Properties())
                if (connection == null) throw new GradleException('Universal SQLite driver rejected its in-memory JDBC URL.')
                try {
                    def result = connection.createStatement().executeQuery('SELECT 1')
                    try {
                        if (!result.next() || result.getInt(1) != 1) {
                            throw new GradleException('Universal SQLite smoke test returned an unexpected result.')
                        }
                    } finally { result.close() }
                } finally { connection.close() }
            } finally { loader.close() }
        } finally {
            zip.close()
        }

        logger.lifecycle('Universal plugin JAR size: '
                + String.format('%.2f MiB', pluginJar.length() / 1024.0 / 1024.0)
                + ' (strict limit: below 30 MiB)')
    }
}

tasks.named('build') {
    dependsOn tasks.named('shadowJar'), tasks.named('verifyPluginJarSize'),
            tasks.named('verifyUniversalPluginJarSize')
}
