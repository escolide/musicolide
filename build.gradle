plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.2.2'
}

group = 'io.github.escolide'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://repo.opencollab.dev/main/' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.1-R0.1-SNAPSHOT'
    compileOnly 'org.geysermc.geyser:api:2.11.2-SNAPSHOT'
    implementation 'org.xerial:sqlite-jdbc:3.50.3.0'
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('shadowJar') {
    archiveClassifier = ''
    mergeServiceFiles()
    relocate 'org.sqlite', 'io.github.escolide.musicolide.internal.sqlite'
}


tasks.named('jar') {
    enabled = false
}

tasks.register('verifyPluginJarSize') {
    dependsOn tasks.named('shadowJar')
    doLast {
        def pluginJar = tasks.named('shadowJar').get().archiveFile.get().asFile
        def maximumBytes = 30L * 1024L * 1024L
        if (pluginJar.length() > maximumBytes) {
            throw new GradleException("Plugin JAR is ${pluginJar.length()} bytes; maximum allowed is ${maximumBytes} bytes.")
        }
        logger.lifecycle("Plugin JAR size: ${String.format('%.2f MB', pluginJar.length() / 1024.0 / 1024.0)} (limit: 30 MB)")
    }
}

tasks.named('build') {
    dependsOn tasks.named('shadowJar'), tasks.named('verifyPluginJarSize')
}
