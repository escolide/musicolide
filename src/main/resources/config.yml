# Musicolide configuration. Compatible target: Paper 1.21.1 through 26.3.
# The resource-pack format is detected automatically from the running server version.
general:
  debug: false
  language: en
  check-interval-ticks: 5
  shutdown-stop-playback: true

server:
  hosting-mode: "shared-port"
  bind-address: "0.0.0.0"
  port: 8765

  # Automatically discover the server's outbound public IP over HTTPS when no URL is provided.
  # This cannot identify a hosting provider's inbound proxy hostname or translated public port.
  auto-detect-public-address: true

  # Optional manual override. For NAT/proxy hosts, use the hostname players use to join.
  # Leave empty to use the automatically discovered public IP.
  public-base-url: ""

  # Detect the Minecraft listener port automatically.
  auto-detect-port: true
  public-port: -1

  path-prefix: "/packs"
  max-download-mb: 100
  
audio:
  tools:
    # Download pinned yt-dlp, FFmpeg and QuickJS builds over HTTPS on first startup.
    # The download, checksum verification and extraction run in a background worker.
    # Installed tools remain in plugins/Musicolide/native/ across server restarts.
    # Set false only when you manage all required executables yourself.
    download-on-first-start: true
  ffmpeg:
    executable: "ffmpeg"
    required: false
  # Controls how NEW imports are encoded. Existing catalogue tracks keep their format.
  # segmented: legacy short OGG segments; pause/resume preserves position at segment timing.
  # continuous: one streamed OGG; resume restarts at the beginning (Minecraft exposes no stream seek).
  # resumable: one streamed OGG; resume creates a timestamped OGG tail with FFmpeg and a temporary pack.
  # Timestamp-based resume is for Java clients. Mixed sessions with online Bedrock players use the
  # compatible restart-from-beginning fallback because Geyser's aggregate pack is fixed at join time.
  playback-mode: "resumable"
  yt-dlp:
    enabled: true
    executable: "yt-dlp"
    # When enabled by an administrator, /play <url> imports a YouTube URL.
    # Imports remain admin-only and must be authorized for download and redistribution.
    # Keep false unless the server operator has confirmed those rights.
    auto-import-on-play: true
    # QuickJS is installed as qjs beside yt-dlp and FFmpeg.
    js-runtime-executable: "qjs"
    # URL-imported packs become eligible for expiry this many minutes after import.
    # Active playback sessions and in-flight Java pack downloads delay deletion.
    url-import-retention-minutes: 15
    # Add only domains from which the server has permission to download and redistribute audio.
    # YouTube domains are prelisted, but auto-import remains off until an admin opts in.
    # For a one-time import, use /music import-url <url> --rights-confirmed.
    allowed-hosts:
      - "youtube.com"
      - "youtu.be"
    blocked-hosts:
      - "spotify.com"
      - "soundcloud.com"
  format: "ogg"
  sample-rate: 44100
  # Used only when audio.playback-mode is 'segmented'.
  segment-duration-ms: 1000
  stereo-quality: 5
  max-track-duration-seconds: 1800
  max-input-mb: 100
  delete-source-after-import: true
  processing:
    max-queued-jobs: 8
    timeout-seconds: 1800
    probe-timeout-seconds: 30
    yt-dlp-timeout-seconds: 600
    ffmpeg-threads: 1

resource-packs:
  required-on-first-use: false
  prompt: "Musicolide needs its music library to play tracks."
  # on-play: send the complete Java music library when a player first starts/needs music.
  # on-join: send it as the player joins, even when no music is currently playing.
  # The Java library is one pack containing all imported tracks; new imports publish a new revision.
  download-mode: "on-play"
  strategy: "library"
  prefetch:
    enabled: true
    tracks-ahead: 4
    max-concurrent-downloads: 2
    max-prefetch-mb-per-player: 40
  cache:
    enabled: true
    max-size-gb: 5
    retain-unused-files-days: 30
    # false keeps the music library active for the entire connection and lets
    # Minecraft reuse its local SHA-1 cache after reconnecting.
    remove-pack-after-session: false

playback:
  default-volume: 100
  default-mode: "stereo"
  overlap:
    enabled: true
    priority-policy: "first-started"
    manual-priority-enabled: true
    warn-session-owner: true
    warning-cooldown-seconds: 60
  range:
    default-shape: "circle"
    circle:
      radius: 60
    square:
      width: 50
      length: 50
      rotation: "world"
    vertical:
      mode: "unlimited"
      max-distance: 32
  fade:
    enabled-by-default: false
    distance: 10
    transition: true
  synchronization:
    action-bar-now-playing: true
    # Wait for all current, audible recipients to have a ready pack before starting a new track.
    # This prevents faster clients starting the shared clock while others are still downloading.
    start-barrier: true
    bedrock:
      # Include Bedrock players in the shared start barrier once Geyser reports
      # their initial music-pack exchange as play-ready.
      enabled: true
    progress-update-ticks: 20

playlists:
  enabled: true
  shuffle: false
  repeat: false
  prefetch-next: true

matching:
  enabled: true
  warn-when-approximate: true
  require-confirmation-for-alias: true
  metadata-lookup: true

worldguard:
  enabled: true
  require-plugin: false

limits:
  max-sessions: 20
  max-queue-length: 500
  max-playlist-tracks: 500
  max-track-library-gb: 10

permissions:
  use: "musicolide.use"
  dj: "musicolide.dj"
  admin: "musicolide.admin"

messages:
  prefix: "&8[&bMusicolide&8] &r"
  no-permission: "&cYou do not have permission to do that."
  player-only: "&cThis command must be run by a player."
  track-not-found: "&cTrack not found. Import an authorized audio file first."
  pack-not-ready: "&eThe resource pack is still loading. Playback will begin when it is ready."
  pack-declined: "&cYou declined the Musicolide resource pack; music cannot be played."
  overlap-warning: "&eYour music zone overlaps an earlier session. Your track is suppressed in the shared area."
  approximate-match: "&eThis may be a different recording. Confirm before playback."
  import-started: "&aPreparing audio."
  import-complete: "&aImported &f{title}&a (&f{id}&a)."
  import-failed: "&cAudio import failed: {reason}"
  bedrock-not-supported: "&eMusicolide Bedrock audio is unavailable until a Bedrock music pack has been generated."
  bedrock-pack-reconnect: "&eThe Bedrock music pack changed after you joined. Reconnect to receive the latest music library."
  bedrock-resume-unsupported: "&eThis track resumed at a timestamp using a temporary Java pack. Bedrock playback is unavailable until the next track."
  playback-started: "&aNow playing: &f{title}"
  playback-paused: "&ePlayback paused."
  playback-resumed: "&aPlayback resumed."
  playback-synchronizing: "&eSynchronizing listeners before playback starts..."
  playback-stopped: "&cPlayback stopped."
  queue-empty: "&eThe queue is empty."
  reload-complete: "&aConfiguration reloaded."
