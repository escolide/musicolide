name: Musicolide
version: 0.1.0
main: io.github.escolide.musicolide.MusicolidePlugin
api-version: '1.21.1'
description: Server-side music playback using dynamically generated Minecraft resource packs.
author: escolide
softdepend:
  - WorldGuard
  - Geyser-Spigot
commands:
  music:
    description: Control Musicolide playback, YouTube search and the local music catalogue.
    usage: /music help
    aliases: [musicolide, m]
  play:
    description: Play a track or import an administrator-allowlisted URL.
    usage: /play <track-title, search query or YouTube URL>
    permission: musicolide.dj
  link:
    description: Generate a one-time five-minute Discord account-link code.
    usage: /link
    permission: musicolide.use
  unlink:
    description: Unlink your Discord account from Minecraft.
    usage: /unlink
    permission: musicolide.use
  deafen:
    description: Mute Musicolide audio for yourself.
    usage: /deafen
    permission: musicolide.use
  undeafen:
    description: Unmute Musicolide audio for yourself.
    usage: /undeafen
    permission: musicolide.use
permissions:
  musicolide.use:
    description: Allows use of Musicolide playback commands.
    default: true
  musicolide.dj:
    description: Allows starting and controlling music sessions.
    default: op
    children:
      musicolide.use: true
  musicolide.admin:
    description: Allows importing tracks and changing Musicolide configuration.
    default: op
    children:
      musicolide.dj: true
